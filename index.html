<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильмы, которые я смотрел</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="ambient-backdrop" class="ambient-backdrop"></div>

    <!-- Главная страница -->
    <main id="intro-screen" class="screen intro-screen active">
        <div class="intro-content">
            <h1 class="main-title">ПОНРАВИВШИЕСЯ ФИЛЬМЫ,</h1>
            <p class="subtitle">КОТОРЫЕ Я СМОТРЕЛ</p>
            <div class="intro-action">
                <button id="start-btn" class="btn-primary" type="button">
                    <span>Начать просмотр</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Страница фильма -->
    <section id="movie-screen" class="screen movie-screen">
        <header class="movie-header">
            <div id="movie-counter" class="movie-counter">01 / 15</div>
            <button id="audio-toggle-btn" class="audio-control" type="button">
                <div class="equalizer">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span id="audio-status-text">Звук</span>
            </button>
        </header>

        <div id="movie-stage" class="movie-stage">
            <div class="poster-container">
                <div class="poster-frame">
                    <img id="movie-poster" src="" alt="Обложка фильма" class="movie-poster">
                </div>
            </div>

            <div class="movie-details">
                <h2 id="movie-title" class="movie-title"></h2>
                <p id="movie-description" class="movie-description"></p>
                <div class="movie-actions">
                    <button id="next-btn" class="btn-primary" type="button">
                        <span id="next-btn-text">Следующий фильм</span>
                        <svg id="next-btn-arrow" class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
